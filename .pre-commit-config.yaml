repos:
  # Check for trailing whitespace, merge conflicts, and broken YAML files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Run the Ruff linter and formatter automatically
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.2
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  # Run our local Pytest suite
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
