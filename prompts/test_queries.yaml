# Predefined test queries for batch benchmark auto-testing.
# Each entry maps a prompt (must match a line in prompt.txt exactly) to a list of test queries.
# Queries should NOT end with a period — the evaluator adds it automatically.

- prompt: "Write a Prolog predicate for the Fibonacci sequence."
  queries:
    - "fibonacci(0, X)"
    - "fibonacci(1, X)"
    - "fibonacci(10, X)"

- prompt: "Write a Prolog predicate to calculate the factorial of a number."
  queries:
    - "factorial(0, X)"
    - "factorial(5, X)"
    - "factorial(10, X)"

- prompt: "Define a Prolog predicate fibonacci/2 that calculates the Nth Fibonacci number."
  queries:
    - "fibonacci(0, X)"
    - "fibonacci(1, X)"
    - "fibonacci(10, X)"

- prompt: "Implement a Prolog predicate reverse_list/2 to reverse a list."
  queries:
    - "reverse_list([], X)"
    - "reverse_list([1,2,3], X)"
    - "reverse_list([a,b,c,d], X)"

- prompt: "Define a Prolog predicate sum_list/2 that calculates the sum of a list of numbers."
  queries:
    - "sum_list([], X)"
    - "sum_list([1,2,3], X)"
    - "sum_list([10,20,30], X)"

- prompt: "Write a Prolog predicate to find the maximum element in a list."
  queries:
    - "max_list([1], X)"
    - "max_list([3,1,4,1,5,9], X)"
    - "max_list([10,20,5], X)"

- prompt: "Solve the SEND + MORE = MONEY cryptarithmetic puzzle in Prolog. Create a predicate solve_money([S,E,N,D,M,O,R,Y]) that binds the letters to distinct digits from 0 to 9."
  queries:
    - "solve_money([S,E,N,D,M,O,R,Y]), S \\= 0, M \\= 0"

- prompt: "Implement a Prolog predicate encode(List, Encoded) that performs run-length encoding on a list. For example, [a,a,a,b,b,c] becomes [[3,a], [2,b], [1,c]]."
  queries:
    - "encode([a,a,a,a,b,c,c,a,a,d,e,e,e,e], X)"
    - "encode([], X)"
    - "encode([x], X)"

- prompt: "Write a Prolog predicate quicksort(List, Sorted) that sorts a list of numbers using the QuickSort algorithm. Include the partition/4 helper predicate."
  queries:
    - "quicksort([5,3,7,1,9,2,0,4], X)"
    - "quicksort([], X)"
    - "quicksort([10,10,10,10], X)"
